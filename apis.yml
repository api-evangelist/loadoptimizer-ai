aid: loadoptimizer-ai

name: LoadOptimizer.ai

description: LoadOptimizer.ai provides an AI‑powered 3‑D load‑planning service for containers, trucks and pallets. Its API lets developers submit
  a job describing items, dimensions and constraints, then poll for a detailed load plan that optimizes space utilization, reduces trips and cuts
  costs. The platform supports REST/JSON with OpenAPI 3.1, offers idempotent job handling, and includes authentication via API keys. It targets
  logistics, shipping and warehousing companies seeking automated load optimization.

