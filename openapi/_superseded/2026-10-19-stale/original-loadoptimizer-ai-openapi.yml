openapi: 3.1.0

info:
  title: Load Optimizer API
  version: 2.0.0
  summary: Asynchronous box-packing / load-optimization API (the /v2 subset actually implemented today).
  description: |
    Submitting work is **asynchronous**: every solve is a *job* you create, poll it, then collect.

servers:
  - url: https://api.loadoptimizer.ai/v2
    description: Production

security:
  - ApiKey: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Service liveness echo
  /jobs:
    post:
      operationId: createJob
      summary: Submit an optimization job
  /jobs/validate:
    post:
      operationId: validateJob
      summary: Dry-run validation of a request without creating a job
