  /libraries/{id}/entries:
    parameters: [ { $ref: '#/components/parameters/LibraryId' } ]
    get:
      tags: [Libraries]
      operationId: listLibraryEntries
      summary: List the entries in a library
      description: >-
        The entries in the order they were created, as full definitions, a page at a time: carriers in a carrier
        library, SKUs in the SKU library. Follow `nextCursor` until it is null. Never lists an archived entry: a
        retired one stops appearing here as well as by id. `q` and `externalId` combine: an entry must match both.
      parameters:
        - { name: q, in: query, required: false, description: 'Only entries whose `name` or `externalId` contains this text, ignoring case. Matched literally: `%` and `_` are ordinary characters. At most 256 characters.', schema: { type: string, maxLength: 256 } }
        - { name: externalId, in: query, required: false, description: 'Only entries with exactly this externalId, case-sensitive. On a SKU library at most one, because a SKU code is unique there; a carrier library allows duplicate labels, so it may return several. At most 128 characters.', schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, required: false, description: 'Entries per page, 1 to 200. Default 100.', schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, required: false, description: 'The `nextCursor` of the previous page of the same library, passed back unchanged. A value this API did not issue, or one issued for another library, is rejected with `400`. At most 4,096 characters.', schema: { type: string, maxLength: 4096 } }
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryEntryPage' }
              examples:
                firstPage:
