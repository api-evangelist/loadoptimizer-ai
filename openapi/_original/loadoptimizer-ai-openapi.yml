openapi: 3.1.0

# ============================================================================
# Load Optimizer API: OpenAPI 3.1 definition.
# Async load-optimization: create a job, poll it, collect the result.
# ============================================================================

info:
  title: Load Optimizer API
  version: 2.0.0
  summary: Asynchronous box-packing / load-optimization API.
  description: |-
    Submitting work is **asynchronous**: every solve is a *job* you create, poll, then collect.

    This is the documentation of the **Load Optimizer API v2**: it describes what `/v2` supports;
    what it does not describe is not supported.

    ## Job lifecycle
    `queued → running → succeeded | failed | cancelled` (last three terminal). Poll `GET /jobs/{id}` until terminal.

    ## Conventions
    Values from a fixed set (enum values, in a request body or in list filters such as `status`, `saved` and
    `sort`) are matched without regard to case, and come back in the spelling published here: `"MM"` reads
    back as `"mm"`. Names and codes keep their case: group names, a SKU's code (`externalId`, also as a
    filter) and system-catalogue slugs are case-sensitive. The idempotency fingerprint compares the body as you
    sent it: an enum value in another case makes a different body, so while the key is kept (see `Idempotency-Key`)
    the same key gets the `409`.
  contact:
    email: contact@loadoptimizer.ai

servers:
  - url: https://api.loadoptimizer.ai/v2
    description: Production environment of the Load Optimizer API.
    x-internal: false

security:
  - ApiKey: []

tags:
  - name: Jobs
    description: Submit, poll, fetch and cancel optimization jobs; loading-instruction PDFs and share links.
  - name: Saved loads
    description: Keep the runs that matter under a name, within your plan's limit per problem type.
  - name: Libraries
    description: Store your own carriers and cargo units (SKUs) once and reference them from a job by id.
  - name: Health
    description: Check that the API is up. Needs no API key and does not count against the rate limit.

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service liveness echo
      description: >-
        Anonymous liveness check. Always answers `status: "ok"` if the API is up at all; it deliberately
        runs no readiness checks of its own. Sending your key is harmless but pointless: this operation sits
        outside the authenticated surface, so it answers the same whether you send one, send a bad one, or
        send none, and it never reports on your plan.
      security: []
      responses:
        '200':
          description: The API is up and answering requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, apiVersion]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, description: 'Opaque build identifier, e.g. `1a2b3c4d`. Compare it for equality to spot a deploy; do not parse it.' }
                  apiVersion:
                    type: string
                    pattern: '^\d+\.\d+\.\d+$'
                    description: >-
                      The version of the contract this API serves, the contract's `info.version`, such as `2.0.0`. The
                      Changelog names each release by it, so compare the two to see which changes the API you call
                      already has.
              examples:
                live:
                  summary: The API is up
                  value: { status: ok, version: '1a2b3c4d', apiVersion: '2.0.0' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List orders
      description: >-
        The orders your account submitted, a page at a time, newest first unless you sort otherwise. A
        loading-instructions job is not listed; reach it through the id `POST /jobs/{id}/instructions` returned.
        Each item is the same `JobStatus` that `GET /jobs/{id}` returns. Follow `nextCursor` until it is null,
        passing the same filters, `sort` and `direction` on every page. There is no total count. Every invalid
        parameter is reported at once, in one `400` with one `errors[]` entry per parameter, whose `pointer` is
        the parameter's name.
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          description: 'Only orders in one of these statuses. Repeat the parameter for several: `?status=succeeded&status=cancelled`.'
          schema: { type: array, items: { type: string, enum: [queued, running, succeeded, failed, cancelled] } }
        - name: problemType
          in: query
          required: false
          style: form
          explode: true
          description: 'Only orders of one of these problem types. Repeatable, like `status`; different filters combine.'
          schema: { type: array, items: { type: string, enum: [LoadPlanning, MixedPalletizing] } }
        - name: q
          in: query
          required: false
          description: 'Only orders whose `name` contains this text, ignoring case. Matched literally: `%` and `_` are ordinary characters. Leading and trailing whitespace is ignored. At most 256 characters.'
          schema: { type: string, maxLength: 256 }
        - name: createdFrom
          in: query
          required: false
          description: 'Only orders submitted at or after this moment (inclusive). An RFC 3339 date-time with an offset, e.g. `2026-09-01T00:00:00Z`; in a URL, send a `+` offset as `%2B`.'
          schema: { type: string, format: date-time, maxLength: 33 }
        - name: createdTo
          in: query
          required: false
          description: 'Only orders submitted before this moment (exclusive), so consecutive windows neither overlap nor leave a gap. Same format as `createdFrom`, and not earlier than it.'
          schema: { type: string, format: date-time, maxLength: 33 }
        - name: saved
          in: query
          required: false
          description: 'Only orders kept as a saved load (`true`), or only those that are not (`false`). Omit it for both. One value; anything else, a repeat or an empty value included, is rejected with `400` on `saved`.'
          schema: { type: boolean }
        - name: sort
          in: query
          required: false
          description: 'The order of the list. Within equal names or problem types the newest order comes first, and orders created at the same moment follow their id, in the direction you ask for under `sort=createdAt`. Under `sort=name`, orders without a name come last in both directions, and an order renamed while you page through the list can move.'
          schema: { type: string, enum: [createdAt, name, problemType], default: createdAt }
        - name: direction
          in: query
          required: false
          description: 'The sort direction: `desc` by default for `createdAt` (newest first), `asc` for `name` and `problemType`.'
          schema: { type: string, enum: [asc, desc] }
        - name: limit
          in: query
          required: false
          description: 'Orders per page, 1 to 50. Default 50.'
          schema: { type: integer, format: int32, minimum: 1, maximum: 50, default: 50 }
        - name: cursor
          in: query
          required: false
          description: 'The `nextCursor` of the previous page, passed back unchanged with the same `sort` and `direction`. A value this API did not issue, one issued by the other list, or one issued for another sort or direction, is rejected with `400`. At most 4,096 characters.'
          schema: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: One page of the orders your account submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
              examples:
                firstPage:
                  summary: A page with more to follow
                  value:
                    items:
                      - jobId: 01975cbc-1f40-7d21-9b3e-5a7c2e8f0d19
                        status: succeeded
                        percentage: 100
                        queuePosition: null
                        errorCategory: null
                        error: null
                        name: Rotterdam week 40
                        createdAt: '2026-09-28T08:12:33.412+00:00'
                        problemType: LoadPlanning
                        saved: true
                    nextCursor: djE6WyJjcmVhdGVkQXQiLCJkZXNjIixudWxsLCIyMDI2LTA5LTI4VDA4OjEyOjMzLjQxMiswMDowMCIsIjAxOTc1Y2JjLTFmNDAtN2QyMS05YjNlLTVhN2MyZThmMGQxOSJd
                lastPage:
                  summary: The last page
                  value:
                    items:
                      - jobId: 01975cbd-3a52-7e8f-8c14-6d0b9f3e7a52
                        status: failed
                        percentage: 50
                        queuePosition: null
                        errorCategory: solver_error
                        error: { code: solver_error, message: The solve did not complete. Please retry. }
                        name: null
                        createdAt: '2026-08-18T15:47:02.861+00:00'
                        problemType: LoadPlanning
                        saved: false
                    nextCursor: null
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

    post:
      tags: [Jobs]
      operationId: createJob
      summary: Submit an optimization job
      description: |-
        Validates the request (`400` on failure), then queues it for solving. Returns `202` with the job id
        and its status: `queued` for a new job, its current status for a replay.
        This surface has no synchronous fast path; poll `GET /jobs/{id}`
        for progress. An optional `Idempotency-Key` header (`<=200` chars) makes a repeat submit with the
        same body return the original job instead of creating a duplicate, for at least 24 hours after it
        was submitted, and for as long as it is queued or running. In that window the same key with a
        different body is rejected with `409` (empty body); after it, the same key can start a new job.
        The whole submitted body is the fingerprint, values as sent (an enum value in another case is a different body), `units`
        included: retrying the same key with different units is a different body, and gets the `409`, not
        a replay of the original job.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
            examples:
              onePalletTwoBoxes:
                $ref: '#/components/examples/OnePalletTwoBoxes'
              mixedPalletsForOneStore:
                $ref: '#/components/examples/MixedPalletsForOneStore'
              cargoFromSkuLibrary:
                $ref: '#/components/examples/CargoFromSkuLibrary'
      responses:
        '202':
          description: Accepted. A new job is queued; a replay of an earlier submit carries the original job in the status it has now.
          headers:
            Location:
              description: URL of the created job.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              examples:
                queued:
                  summary: Job accepted, nothing solved yet
                  value: { jobId: 01975cba-67b9-7b7c-a2f1-3d29e4a01c44, status: queued }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Either the account's plan does not include customer-API access at all (`code:
            "customer_api_not_entitled"`), or it does not include the job's `problemType`: `code:
            "mixed_palletizing_not_entitled"` for a `MixedPalletizing` job, `code:
            "load_planning_not_entitled"` for `LoadPlanning`. A carrier or cargo line referencing a company-library
            entry (a UUID `libraryId`) answers `code: "libraries_not_entitled"`, before any lookup, when that type of
            library is not available on the plan: a type is available when the plan includes company libraries
            and its own size limit is not 0. Distinct from the `422` below, which means the order itself is
            too big, not that the capability is missing; also distinct from the `429` quota, which means the
            capability is there but used up for the month.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notEntitled:
                  $ref: '#/components/examples/NotEntitled'
                mixedPalletizingNotEntitled:
                  summary: The plan does not include mixed palletizing
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.4'
                    title: Forbidden
                    status: 403
                    code: mixed_palletizing_not_entitled
                    detail: This problem type is not available on your plan.
                librariesNotEntitled:
                  summary: A carrier or cargo line references a company-library entry of a type the plan does not include
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.4'
                    title: Company libraries are not available on your plan.
                    status: 403
                    code: libraries_not_entitled
                    detail: Your plan does not include company libraries.
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/EntitlementProblem' }
        '429': { $ref: '#/components/responses/TooManyActiveJobs' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/validate:
    post:
      tags: [Jobs]
      operationId: validateJob
      summary: Dry-run validation of a request without creating a job
      description: |-
        Runs the same validation as `POST /jobs`, library references included, but creates no job, triggers no
        solve, and runs no plan-limit, problem-type or quota check of its own. The one access check it shares with
        `POST /jobs` is the company-library gate: a carrier or cargo line referencing a company-library entry (a
        UUID `libraryId`) of a type the plan does not include answers `403 libraries_not_entitled` here too, before
        any lookup. A body that validates here can still be rejected by `POST /jobs` with `403`/`422`/`429`. Every
        validation failure comes back in the same code-bearing `problem+json` shape here as on `POST /jobs`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
            examples:
              onePalletTwoBoxes:
                $ref: '#/components/examples/OnePalletTwoBoxes'
              mixedPalletsForOneStore:
                $ref: '#/components/examples/MixedPalletsForOneStore'
              cargoFromSkuLibrary:
                $ref: '#/components/examples/CargoFromSkuLibrary'
      responses:
        '200':
          description: 'Valid. `warnings` is reserved and always empty today.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResult' }
              examples:
                valid:
                  summary: The request validates
                  value: { valid: true, warnings: [] }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/LibrariesForbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/{id}:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Poll job status
      description: >-
        The job's status and progress, for an order or a loading-instructions job alike. Poll it until `status`
        is `succeeded`, `failed` or `cancelled`; those three are final. After `succeeded`, fetch the result with
        `GET /jobs/{id}/result` (an order) or the PDFs with `GET /jobs/{id}/instructions` (an instructions job).
      responses:
        '200':
          description: >-
            Current status. A job that fails during solving still answers `200` here: the failure is in the
            body (`status: "failed"`, `errorCategory`, `error`), not an HTTP error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
              examples:
                running:
                  summary: Mid-solve
                  value:
                    jobId: 01975cba-67b9-7b7c-a2f1-3d29e4a01c44
                    status: running
                    percentage: 50
                    queuePosition: null
                    errorCategory: null
                    error: null
                    name: null
                    createdAt: '2026-08-19T08:12:33.412+00:00'
                    problemType: LoadPlanning
                    saved: false
                succeeded:
                  summary: Terminal, the result can be collected
                  value:
                    jobId: 01975cba-67b9-7b7c-a2f1-3d29e4a01c44
                    status: succeeded
                    percentage: 100
                    queuePosition: null
                    errorCategory: null
                    error: null
                    name: Rotterdam morning run
                    createdAt: '2026-08-19T08:12:33.412+00:00'
                    problemType: LoadPlanning
                    saved: false
                failed:
                  summary: Terminal, and the failure is in the body rather than the status code
                  value:
                    jobId: 01975cbd-3a52-7e8f-8c14-6d0b9f3e7a52
                    status: failed
                    percentage: 50
                    queuePosition: null
                    errorCategory: solver_error
                    error: { code: solver_error, message: The solve did not complete. Please retry. }
                    name: null
                    createdAt: '2026-08-18T15:47:02.861+00:00'
                    problemType: LoadPlanning
                    saved: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/{id}/result:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      operationId: getJobResult
      summary: Fetch the packing result (once succeeded)
      description: >-
        The packing result of an order, once `GET /jobs/{id}` reports `succeeded`: each carrier with its
        placements and KPIs, the cargo that did not fit, and the totals, in the units the job was submitted in.
        Before that it answers `404 result_not_ready`.
      responses:
        '200':
          description: The packing result, in the units the job was submitted in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResult' }
              examples:
                onePallet:
                  summary: Both units of one cargo line on a single pallet
                  value:
                    jobId: 01975cba-67b9-7b7c-a2f1-3d29e4a01c44
                    status: succeeded
                    units: { length: m, weight: kg, volume: m3, area: m2, ldm: m }
                    summary: { carriersUsed: 1, itemsPlaced: 2, itemsUnplaced: 0, totalWeight: 10.0 }
                    carriers:
                      - externalId: EUR-PALLET
                        name: null
                        instance: 1
                        geometry: { type: box, dimensionX: 1.2, dimensionY: 0.8, dimensionZ: 1.5, box: { dimensionX: 1.2, dimensionY: 0.8, dimensionZ: 1.5 } }
                        kpis: { volumeUtilization: 3.3, loadedWeight: 10.0, loadedVolume: 0.048, itemCount: 2 }
                        placements:
                          - x: 0.0
                            y: 0.0
                            z: 0.0
                            sizeX: 0.3
                            sizeY: 0.4
                            sizeZ: 0.2
                            orientationRx: 0
                            orientationRy: 0
                            orientationRz: 0
                            weight: 5.0
                            geometry: { type: box, dimensionX: 0.3, dimensionY: 0.4, dimensionZ: 0.2, box: { dimensionX: 0.3, dimensionY: 0.4, dimensionZ: 0.2 } }
                            description: Box A
                            color: null
                            externalId: SKU-123
                            category: box
                            group: []
                            groups: []
                            itemId: 01975cba-6a1f-7c3d-9e04-5b71c8f2a613
                            libraryId: null
                          - x: 0.3
                            y: 0.0
                            z: 0.0
                            sizeX: 0.4
                            sizeY: 0.3
                            sizeZ: 0.2
                            orientationRx: 0
                            orientationRy: 0
                            orientationRz: 90
                            weight: 5.0
                            geometry: { type: box, dimensionX: 0.3, dimensionY: 0.4, dimensionZ: 0.2, box: { dimensionX: 0.3, dimensionY: 0.4, dimensionZ: 0.2 } }
                            description: Box A
                            color: null
                            externalId: SKU-123
                            category: box
                            group: []
                            groups: []
                            itemId: 01975cba-6a1f-7c3d-9e04-5b71c8f2a613
                            libraryId: null
                        category: container
                        libraryId: null
                    unplacedItems: []
                    name: Rotterdam morning run
                    createdAt: '2026-08-19T08:12:33.412+00:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            The job exists but has not succeeded yet (`code: "result_not_ready"`), or the id is unknown or
            belongs to another account (`code: "job_not_found"`), both answer identically, on purpose.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notReadyYet:
                  summary: The job exists but has not succeeded
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.5'
                    title: Result not ready.
                    status: 404
                    code: result_not_ready
                unknownJob:
                  $ref: '#/components/examples/JobNotFound'
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/{id}/input:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      operationId: getJobInput
      summary: Fetch the request of an order, with library references resolved
      description: >-
        The request of this order, with every library reference resolved to the values the solver used: the
        `JobRequest` shape under `request`, with any name trimmed and members the API does not know left out.
        Every line comes back inline. A carrier or cargo line that referenced a library entry carries the entry's
        definition as frozen into the job at submit: the sizes and weights the solver used, overrides included, in the
        job's units, and on a cargo line the effective `constraints`. A carrier with no label on the line or the entry
        comes back with the entry's id as its `externalId`, because an inline carrier needs one; `/result` shows
        `null` for it. `sources` lists each entry with the `revision` used and the `lines` of `request` it resolved.
        Enum values come back in the spelling listed here, whatever case you sent them in. A `direction` on
        `CenterLoadMass`, which the API ignores, is left out. A cargo line whose stored category the closed set does
        not know (a job from before that set was closed) reads back as `box`. Use it for what the result does
        not repeat: the size and rules of a cargo line that was not placed, or the carriers you asked for. A later
        rename changes the job's `name`, not this request, and a later change to a library entry changes neither this
        request nor its `sources`. `resolvedAt` is the order's `createdAt`. Orders only, in any status.
      responses:
        '200':
          description: The request, every line inline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobInput' }
              examples:
                onePalletTwoBoxes:
                  summary: The request of the "one pallet type, two units" order
                  value:
                    resolvedAt: '2026-08-19T08:12:33.412+00:00'
                    request:
                      units: { length: m, weight: kg }
                      carriers:
                        - externalId: EUR-PALLET
                          geometry: { type: box, dimensionX: 1.2, dimensionY: 0.8, dimensionZ: 1.5 }
                      cargo:
                        - externalId: SKU-123
                          description: Box A
                          amount: 2
                          weight: 5.0
                          geometry: { type: box, dimensionX: 0.3, dimensionY: 0.4, dimensionZ: 0.2 }
                    sources: []
                skuReferences:
                  summary: 'The request of the order that referenced SKUs: every line inline, `sources` naming the SKU and the lines it resolved'
                  value:
                    resolvedAt: '2026-09-30T10:02:11.508+00:00'
                    request:
                      units: { length: m, weight: kg }
                      carriers:
                        - externalId: TRAILER
                          geometry: { type: box, dimensionX: 13.6, dimensionY: 2.48, dimensionZ: 2.7 }
                      cargo:
                        # Sent as a reference with an allowStackingOnTop override: the SKU's values, written out.
                        - externalId: SKU-4711
                          description: Carton 60x40
                          color: '#3366cc'
                          amount: 24
                          geometry: { type: box, dimensionX: 0.6, dimensionY: 0.4, dimensionZ: 0.4 }
                          weight: 18
                          category: box
                          constraints: { allowStackingOnTop: true, allowedRotations: [Z] }
                          groups: [store-104]
                        # The same SKU with its own label, and the empty allowedRotations override that locks it.
                        - externalId: SKU-4711
                          description: Carton 60x40, this side up
                          amount: 6
                          geometry: { type: box, dimensionX: 0.6, dimensionY: 0.4, dimensionZ: 0.4 }
                          weight: 18
                          category: box
                          constraints: { allowStackingOnTop: true, allowedRotations: [] }
                        - externalId: SPOT-ITEM
                          description: Loose crate
                          amount: 2
                          weight: 30
                          geometry: { type: box, dimensionX: 0.8, dimensionY: 0.6, dimensionZ: 0.5 }
                    sources:
                      - libraryId: 0197d1e4-2a6b-7f3c-8d15-4b9e0c7a2f68
                        revision: 1
                        lines: ['/cargo/0', '/cargo/1']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            The id is unknown, another account's, or a loading-instructions job (`code: "job_not_found"`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                unknownJob:
                  $ref: '#/components/examples/JobNotFound'
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/{id}/name:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    put:
      tags: [Jobs]
      operationId: setJobName
      summary: Set, change or clear a job's name
      description: >-
        Replaces the job's optional label. Send `null`, or omit the key entirely, to clear it; there is no
        `DELETE`. Works in any job status, including a terminal one, and on a loading-instructions job as well
        as on an order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: [string, 'null']
                  maxLength: 256
                  description: >-
                    The new label. `null`, an absent key (a body of `{}`), or a value that is only whitespace
                    all clear the name; anything else is trimmed and stored.
            examples:
              set:
                summary: Give the job a label
                value: { name: Rotterdam morning run }
              clear:
                summary: Remove the label again
                value: { name: null }
      responses:
        '200':
          description: The name now stored on the job, after trimming.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, name]
                properties:
                  jobId: { type: string, format: uuid }
                  name: { type: [string, 'null'] }
              examples:
                set:
                  summary: The label as stored
                  value: { jobId: 01975cba-67b9-7b7c-a2f1-3d29e4a01c44, name: Rotterdam morning run }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a job (cooperative)
      description: >-
        A queued job is finalized to `cancelled` immediately. A running job only gets a cooperative cancel
        flag (the job winds down at its next checkpoint), so poll the status rather than assuming the job is
        already dead on `202`.
      responses:
        '202': { description: Cancel accepted (job was queued or running). Empty body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409':
          description: 'Job already reached a terminal state; nothing to cancel (`code: "job_already_terminal"`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                alreadyTerminal:
                  summary: The job already finished, failed or was cancelled
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.10'
                    title: Job already finished.
                    status: 409
                    code: job_already_terminal
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/{id}/instructions:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [Jobs]
      operationId: createInstructions
      summary: Generate step-by-step loading-instruction PDFs
      description: >-
        Creates a *derived* job that renders one loading-instruction PDF per packed carrier instance of the
        source job, which must have already succeeded. Poll the returned (new) job id with `GET /jobs/{id}`
        until it has succeeded, then download each carrier's PDF via `GET /jobs/{id}/instructions?carrier={n}`
        with that same new id.
      responses:
        '202':
          description: Accepted. The instructions job is queued.
          headers:
            Location:
              description: 'URL of the instructions job this call created: poll it with `GET /jobs/{id}`.'
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              examples:
                queued:
                  summary: A derived job, with its own id
                  value: { jobId: 01975e02-7c7c-7000-8000-00000000abcd, status: queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Either the account's plan does not include customer-API access (`code:
            "customer_api_not_entitled"`), or the request carried a body and this operation accepts none
            (`code: "request_body_not_supported"`). Send it without a body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                bodyNotSupported:
                  $ref: '#/components/examples/BodyNotSupported'
                notEntitled:
                  $ref: '#/components/examples/NotEntitled'
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409':
          description: 'Source job has not succeeded; nothing to render (`code: "job_not_succeeded"`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                sourceNotSucceeded:
                  summary: Nothing to render yet
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.10'
                    title: Source job has not succeeded.
                    status: 409
                    code: job_not_succeeded
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }
    get:
      tags: [Jobs]
      operationId: downloadInstructions
      summary: Download one carrier's loading-instruction PDF
      description: >-
        Here `{id}` is the *instructions* job id returned by `POST /jobs/{id}/instructions`, not the source job: any
        other id, the source order's included, answers `404 job_not_found`. Download once the instructions job
        has succeeded. One PDF per packed carrier; there is no ZIP bundling every carrier. `carrier` selects which one.
      parameters:
        - name: carrier
          in: query
          description: >-
            The 1-based position of the carrier in the source job result's `carriers[]` array, NOT the carrier's
            `instance` number, which restarts at 1 per carrier type. Omit for the first carrier. A value that
            is not a whole number of 1 or greater is rejected with `400` (`code: "validation_failed"`,
            `pointer: "carrier"`); a positive index whose PDF does not exist answers `404`
            `artifact_not_ready`, the same as one that has not finished rendering; once the instructions job has
            succeeded, that answer is final.
          schema: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
      responses:
        '200':
          description: One carrier's loading-instruction PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            Either `artifact_not_ready`: the instructions job is yours but this PDF is not available. While the job is
            queued or running, poll `GET /jobs/{id}` until it succeeds; once it has succeeded the answer is final
            (no PDF at that position, or swept by retention), so request instructions again. Or `job_not_found`: the
            id is unknown, another account's, or not an instructions job (for example the source order's id).
            There is no `410` for a retention-swept artifact.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                artifactNotReady:
                  summary: Not rendered yet (poll the job), or not there at all once the job has succeeded
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.5'
                    title: Instructions are not ready.
                    status: 404
                    code: artifact_not_ready
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /jobs/{id}/share:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [Jobs]
      operationId: createShareLink
      summary: Create a read-only shareable link to the 3D viewer
      description: |-
        Mints a **capability link** to the read-only 3D viewer, on a job that has already succeeded. The link
        you hand out is the response's **`url`**: it opens the viewer in a browser and needs no API key, so
        you can send it to people who aren't users. It exposes only this job's visual result; it does not
        expose the job id, the input, other jobs, or any account data, and it can't call the API.

        The `shareId` is the opaque, unguessable token the link carries (NOT the job id). Re-sharing rotates
        it: there is only ever one active link per job, and the previous one stops working immediately.
        Revoke with `DELETE`; the link also honours `expiresAt`.
      responses:
        '201':
          description: Share link created. Hand out its `url`.
          headers:
            Location:
              description: >-
                Not a URL to hand out and not part of this API: requesting it answers `401`. Share `url` instead.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
              examples:
                created:
                  summary: Link minted, hand out the `url`
                  value:
                    shareId: YzIzaeQtWUysVuPJToFCCHvXpQKZx1ftQAjgFcAuqDI
                    url: https://viewer.loadoptimizer.ai/YzIzaeQtWUysVuPJToFCCHvXpQKZx1ftQAjgFcAuqDI
                    expiresAt: '2027-03-01T12:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Either the account's plan does not include customer-API access (`code:
            "customer_api_not_entitled"`), or it does not include link sharing (`code:
            "link_sharing_not_entitled"`; checked before the job lookup, so a job id that isn't yours never
            leaks through this path either), or the request carried a body and this operation accepts none
            (`code: "request_body_not_supported"`). Send it without a body. The entitlement is checked first, so a caller
            without link sharing that also sends a body hears `link_sharing_not_entitled`.
            Revoking is never gated: only
            minting a new link is a paid feature.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                bodyNotSupported:
                  $ref: '#/components/examples/BodyNotSupported'
                notEntitled:
                  $ref: '#/components/examples/NotEntitled'
                linkSharingNotEntitled:
                  summary: The plan does not include link sharing
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.4'
                    title: Share links are not included in your plan.
                    status: 403
                    code: link_sharing_not_entitled
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409':
          description: 'Job has not succeeded; nothing to share (`code: "job_not_succeeded"`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                jobNotSucceeded:
                  summary: Nothing to share yet
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.10'
                    title: Job has not succeeded.
                    status: 409
                    code: job_not_succeeded
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }
    delete:
      tags: [Jobs]
      operationId: revokeShareLink
      summary: Revoke the shareable link
      description: Idempotent. A job with no active link still answers `204`.
      responses:
        '204': { description: Revoked (or there was nothing to revoke). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /saved-loads:
    post:
      tags: [Saved loads]
      operationId: saveLoad
      summary: Save a run as a saved load
      description: >-
        Keeps one of your succeeded orders as a saved load, under the name you give it. A saved load is the run
        itself, kept: it has the run's id, and the run's request (`/jobs/{id}/input`), result, instructions and
        share link stay where they are, under `/jobs/{id}/...`. The name is the run's name, so
        saving sets it and `PUT /jobs/{id}/name` changes it for both. Your plan allows a number of saved loads
        per problem type. At that limit the save is refused with `422`. A valid `replace` names one of your saved
        loads of the same problem type, which is released in the same call whether or not you are at the limit; a
        refused save releases nothing. Saving a run that is already saved
        answers `409` and changes nothing, so a retry after a timeout tells you the first attempt landed.
      parameters:
        - name: jobId
          in: query
          required: true
          description: 'The id of the run to save: one of your orders that has succeeded. A value that is not a UUID in its 36-character form is rejected with `400` against `jobId`.'
          schema: { type: string, format: uuid, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: 'The name to keep it under. Trimmed, and stored on the run.'
                replace:
                  type: [string, 'null']
                  format: uuid
                  maxLength: 36
                  description: 'The id of one of your saved loads of the same problem type, released in the same call whether or not you are at the limit; a refused save releases nothing. A value that is not a UUID in its 36-character form, or that names a saved load of another problem type, is rejected with `400` against `/replace`.'
            examples:
              save:
                summary: Save a run
                value: { name: Rotterdam week 40 }
              replace:
                summary: Save it in place of an older one
                value: { name: Rotterdam week 41, replace: 01975cbe-8d17-7a64-b2c9-4f06a1d3e5b8 }
      responses:
        '201':
          description: Saved. The run is now a saved load.
          headers:
            Location:
              description: URL of the saved load.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedLoad' }
              examples:
                saved:
                  summary: The run, kept as a saved load
                  value:
                    id: 01975cbc-1f40-7d21-9b3e-5a7c2e8f0d19
                    name: Rotterdam week 40
                    problemType: LoadPlanning
                    createdAt: '2026-09-28T08:12:33.412+00:00'
                    savedAt: '2026-10-01T14:03:10.007+00:00'
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            The run is not one of your orders (`code: "job_not_found"`: unknown, another account's, or a
            loading-instructions job), or `replace` names no saved load of yours (`code: "saved_load_not_found"`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                unknownJob:
                  $ref: '#/components/examples/JobNotFound'
                unknownSavedLoad:
                  $ref: '#/components/examples/SavedLoadNotFound'
        '409':
          description: >-
            The run has not succeeded (`code: "job_not_succeeded"`), or it is already saved
            (`code: "saved_load_exists"`; nothing was changed).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                alreadySaved:
                  summary: The run is already a saved load
                  value:
                    type: 'https://tools.ietf.org/html/rfc9110#section-15.5.10'
                    title: This run is already saved.
                    status: 409
                    code: saved_load_exists
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: >-
            Your plan's saved-load limit for this problem type is reached (`code: "max_saved_loads"`); `detail`
            names the limit. Release a saved load, or name it in `replace`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                limitReached:
                  summary: Every place for this problem type is taken
                  value:
                    type: 'https://tools.ietf.org/html/rfc4918#section-11.2'
                    title: Saved-load limit reached.
                    status: 422
                    code: max_saved_loads
                    detail: The account keeps at most 10 saved loads of this problem type.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }
    get:
      tags: [Saved loads]
      operationId: listSavedLoads
      summary: List saved loads
      description: >-
        Your saved loads, a page at a time, the most recently saved first unless you sort otherwise. Each item is the
        same `SavedLoad` that `GET /saved-loads/{id}` returns. Follow `nextCursor` until it is null, passing the same
        filters, `sort` and `direction` on every page. There is no total count. Every invalid parameter is reported
        at once, in one `400` with one `errors[]` entry per parameter, whose `pointer` is the parameter's name.
      parameters:
        - name: problemType
          in: query
          required: false
          style: form
          explode: true
          description: 'Only saved loads of one of these problem types. Repeat the parameter for several.'
          schema: { type: array, items: { type: string, enum: [LoadPlanning, MixedPalletizing] } }
        - name: q
          in: query
          required: false
          description: 'Only saved loads whose `name` contains this text, ignoring case. Matched literally: `%` and `_` are ordinary characters. Leading and trailing whitespace is ignored. At most 256 characters.'
          schema: { type: string, maxLength: 256 }
        - name: savedFrom
          in: query
          required: false
          description: 'Only loads saved at or after this moment (inclusive). An RFC 3339 date-time with an offset; in a URL, send a `+` offset as `%2B`.'
          schema: { type: string, format: date-time, maxLength: 33 }
        - name: savedTo
          in: query
          required: false
          description: 'Only loads saved before this moment (exclusive). Same format as `savedFrom`, and not earlier than it.'
          schema: { type: string, format: date-time, maxLength: 33 }
        - name: sort
          in: query
          required: false
          description: 'The order of the list: when it was saved, when the run was submitted, its name, or its problem type. Within equal names or problem types the most recently saved comes first. Within equal times (`savedAt`, `createdAt`) the order follows the id of the run, in the direction you ask for. Under `sort=name`, a load whose name was cleared comes last in both directions.'
          schema: { type: string, enum: [savedAt, createdAt, name, problemType], default: savedAt }
        - name: direction
          in: query
          required: false
          description: 'The sort direction: `desc` by default for `savedAt` and `createdAt` (newest first), `asc` for `name` and `problemType`.'
          schema: { type: string, enum: [asc, desc] }
        - name: limit
          in: query
          required: false
          description: 'Saved loads per page, 1 to 50. Default 50.'
          schema: { type: integer, format: int32, minimum: 1, maximum: 50, default: 50 }
        - name: cursor
          in: query
          required: false
          description: 'The `nextCursor` of the previous page, passed back unchanged with the same `sort` and `direction`. A value this API did not issue, one issued by the other list, or one issued for another sort or direction, is rejected with `400`. At most 4,096 characters.'
          schema: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: One page of saved loads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedLoadPage' }
              examples:
                onePage:
                  summary: Everything fits on one page
                  value:
                    items:
                      - id: 01975cbc-1f40-7d21-9b3e-5a7c2e8f0d19
                        name: Rotterdam week 40
                        problemType: LoadPlanning
                        createdAt: '2026-09-28T08:12:33.412+00:00'
                        savedAt: '2026-10-01T14:03:10.007+00:00'
                      - id: 01975cbe-8d17-7a64-b2c9-4f06a1d3e5b8
                        name: Rotterdam week 39
                        problemType: LoadPlanning
                        createdAt: '2026-09-21T08:12:33.412+00:00'
                        savedAt: '2026-09-24T09:30:00.000+00:00'
                    nextCursor: null
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /saved-loads/{id}:
    parameters: [ { $ref: '#/components/parameters/SavedLoadId' } ]
    get:
      tags: [Saved loads]
      operationId: getSavedLoad
      summary: Get a saved load
      description: >-
        One of your saved loads, by its id, which is also its run's job id. An unknown id, a released load and
        another account's load all answer `404`.
      responses:
        '200':
          description: The saved load. Its request (`/jobs/{id}/input`), result, instructions and share link are under `/jobs/{id}/...`, with the same id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedLoad' }
              examples:
                saved:
                  summary: A saved load
                  value:
                    id: 01975cbc-1f40-7d21-9b3e-5a7c2e8f0d19
                    name: Rotterdam week 40
                    problemType: LoadPlanning
                    createdAt: '2026-09-28T08:12:33.412+00:00'
                    savedAt: '2026-10-01T14:03:10.007+00:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SavedLoadNotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }
    delete:
      tags: [Saved loads]
      operationId: deleteSavedLoad
      summary: Release a saved load
      description: >-
        Stops keeping the run, so it no longer counts against your limit. The run itself is untouched: its result and
        name stay, and `GET /jobs?saved=false` lists it again. To undo, save it again. Never limited by your plan, so
        an account over its limit can always make room.
      responses:
        '204': { description: Released. The run itself is untouched. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SavedLoadNotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerProblem' }

  /libraries:
    get:
      tags: [Libraries]
      operationId: listLibraries
      summary: List the libraries you can use
      description: >-
        The libraries your account can use. The system catalogue is listed first: it needs no company-library
        entitlement, so any plan that can use the customer API can read and reference it, and
        `libraries_not_entitled` never applies to a slug. Every company library type follows it when it is
        available, carriers first and then SKUs: a type is available when the plan includes company libraries
        and its own size limit is not 0. A type that is not available is left out of the list rather than
        answered with an error, so without company libraries the list holds only the system catalogue.
      parameters:
        - { name: type, in: query, required: false, description: 'Only libraries of this kind: `carrier` or `sku`. Any other value is rejected with `400`.', schema: { type: string, enum: [carrier, sku] } }
        - { name: scope, in: query, required: false, description: 'Only `company` or only `system` libraries. `system` returns the catalogue. Any other value is rejected with `400`.', schema: { type: string, enum: [system, company] } }
      responses:
        '200':
          description: The libraries you can use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryList' }
              examples:
                companyLibrary:
                  summary: A plan with company libraries, two carriers and three SKUs saved
                  value:
                    items:
                      - { id: carrier_system_default, name: Standard carriers, type: carrier, scope: system, overridable: true, entryCount: 49, access: reference }
                      - { id: 5f0c6a8e-3b1d-5e2a-9c47-81d2f6a0b3e4, name: Company carriers, type: carrier, scope: company, overridable: true, entryCount: 2, access: edit }
                      - { id: 9b3d7e21-4c6a-5f18-8e2b-6a0d4c9f1e73, name: Company SKUs, type: sku, scope: company, overridable: true, entryCount: 3, access: edit }
                companySkuLibrary:
                  summary: 'Only the SKU library: `?type=sku`'
                  value:
                    items:
                      - { id: 9b3d7e21-4c6a-5f18-8e2b-6a0d4c9f1e73, name: Company SKUs, type: sku, scope: company, overridable: true, entryCount: 3, access: edit }
                noCompanyLibraries:
                  summary: 'A plan without company libraries: only the system library'
                  value:
                    items:
                      - { id: carrier_system_default, name: Standard carriers, type: carrier, scope: system, overridable: true, entryCount: 49, access: reference }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
